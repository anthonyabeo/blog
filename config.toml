    weight = 2
    url = "https://linkedin.com/in/anthonyabeo/"
[[params.social]]
    name = "Twitter"
    icon = "fab fa-twitter fa-2x"
    weight = 3
    url = "https://twitter.com/anthonyabeo7/"

