baseurl = "https://anthonyabeo.github.io/"
title = "Anabila"
theme = "hugo-coder"
languagecode = "en"
defaultcontentlanguage = "en"

paginate = 20
canonifyurls = true

pygmentsstyle = "b2"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

disqusShortname = "anthonyabeo-github-io"

[params]
    author = "Anabila"
    info = "Professional Software Developer - Hobbyist Artist"
    description = "Den of Ideas"
    keywords = "blog,developer,personal"
    avatarurl = "images/avatar.jpg"

    favicon_32 = "/static/favicon-32x32.png"
    favicon_16 = "/static/favicon-16x16.png"

    # footercontent = "Enter a text here."

    hidecredits = false
    hidecopyright = false

    rtl = false

    math = true
    custom_css = ["css/custom.css"]

